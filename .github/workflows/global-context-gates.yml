name: Global Context Gates
on:
  pull_request:
  push:
    branches: [global-context-gap-fill, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check capture.js
      - run: node --check provider_adapters.js
      - run: node --check service_worker.js
      - run: node --check bridge.js
      - run: node --check sidepanel.js
      - run: node test-global-context.mjs
      - run: node test-provider-adapters.mjs
